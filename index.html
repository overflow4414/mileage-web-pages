<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KE 마일리지 승급 스캐너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ke-blue: #00256c;
            --ke-sky: #0066b3;
            --ke-mint: #0f9f8f;
        }

        body {
            background:
                linear-gradient(135deg, rgba(0, 37, 108, 0.06), rgba(15, 159, 143, 0.08)),
                #f8fafc;
        }

        .surface {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(203, 213, 225, 0.8);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        .route-card {
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .route-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
        }

        .filter-pill {
            transition: background 0.16s ease, color 0.16s ease, border 0.16s ease;
        }

        .filter-pill.active {
            background: var(--ke-blue);
            border-color: var(--ke-blue);
            color: #fff;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen">
    <main class="max-w-6xl mx-auto px-4 py-6 md:px-8 md:py-10">
        <header class="mb-8">
            <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
                <div>
                    <p class="text-sm font-semibold tracking-wide text-sky-700">ICN 출발 구매와 동시 승급</p>
                    <h1 class="mt-2 text-3xl md:text-4xl font-bold text-slate-950">대한항공 일반석 -> 프레스티지 승급</h1>
                    <p class="mt-3 text-sm text-slate-600">
                        업데이트:
                        <span id="last-updated" class="font-mono text-xs bg-white border border-slate-200 px-2 py-1 rounded">-</span>
                    </p>
                </div>
                <a href="https://www.koreanair.com/booking/search?bookingType=R&gnb=true"
                   target="_blank"
                   class="inline-flex items-center justify-center rounded-lg bg-sky-700 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-sky-800">
                    대한항공 예매 열기
                </a>
            </div>
        </header>

        <section class="surface rounded-xl p-4 md:p-5 mb-6">
            <div class="grid gap-4 md:grid-cols-[minmax(220px,320px),1fr] md:items-end">
                <label class="block">
                    <span class="block text-sm font-semibold text-slate-700 mb-2">도착지</span>
                    <select id="dest-filter" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-900 focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-100">
                        <option value="all">전체 노선</option>
                        <option value="CDG">파리 (CDG)</option>
                        <option value="FRA">프랑크푸르트 (FRA)</option>
                        <option value="SYD">시드니 (SYD)</option>
                        <option value="SFO">샌프란시스코 (SFO)</option>
                        <option value="LAS">라스베가스 (LAS)</option>
                    </select>
                </label>
                <div>
                    <span class="block text-sm font-semibold text-slate-700 mb-2">표시</span>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" data-class="all" class="filter-pill active rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700">전체</button>
                        <button type="button" data-class="upgrade" class="filter-pill rounded-full border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm font-semibold text-emerald-700">승급 가능</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="grid gap-3 sm:grid-cols-3 mb-6">
            <div class="surface rounded-xl p-4">
                <div class="text-xs font-semibold text-slate-500">노선</div>
                <div id="stat-routes" class="mt-1 text-2xl font-bold text-slate-950">0</div>
            </div>
            <div class="surface rounded-xl p-4">
                <div class="text-xs font-semibold text-slate-500">승급 가능일</div>
                <div id="stat-dates" class="mt-1 text-2xl font-bold text-slate-950">0</div>
            </div>
            <div class="surface rounded-xl p-4">
                <div class="text-xs font-semibold text-slate-500">승급 유형</div>
                <div class="mt-1 text-lg font-bold text-slate-950">일반석 -> 프레스티지</div>
            </div>
        </section>

        <div id="loading" class="surface rounded-xl py-16 text-center">
            <div class="mx-auto mb-4 h-11 w-11 animate-spin rounded-full border-4 border-sky-100 border-t-sky-700"></div>
            <p class="text-sm text-slate-500">데이터 불러오는 중...</p>
        </div>

        <div id="content" class="hidden space-y-5"></div>

        <div id="empty-state" class="surface hidden rounded-xl py-16 px-4 text-center">
            <p class="text-lg font-semibold text-slate-800">선택한 조건에 맞는 승급 가능일이 없습니다</p>
            <p class="mt-2 text-sm text-slate-500">좌석 상황은 계속 바뀌므로 다음 자동 스캔 때 다시 갱신됩니다.</p>
        </div>

        <footer class="mt-10 border-t border-slate-200 pt-5 text-center text-sm text-slate-500">
            <p>자동 수집 데이터이며 참고용입니다. 예약 전 대한항공 공식 사이트에서 최종 확인하세요.</p>
            <p class="mt-2"><a href="https://github.com/overflow4414/mileage-web-pages" target="_blank" class="font-semibold text-sky-700 hover:underline">GitHub Pages repository</a></p>
        </footer>
    </main>

    <script>
        let allData = {};
        let currentDestFilter = 'all';
        let currentClassFilter = 'all';

        const DEST_NAMES = {
            CDG: '파리',
            FRA: '프랑크푸르트',
            SYD: '시드니',
            SFO: '샌프란시스코',
            LAS: '라스베가스'
        };

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('데이터 파일 없음');
                allData = await res.json();
                document.getElementById('last-updated').innerText = allData.updatedAt || '알 수 없음';
                document.getElementById('loading').classList.add('hidden');
                renderRoutes();
            } catch (e) {
                document.getElementById('loading').innerHTML = `
                    <p class="text-lg font-semibold text-red-600">데이터 로드 실패</p>
                    <p class="mt-2 text-sm text-slate-400">${e.message}</p>
                `;
            }
        }

        function isUpgradeClass(className) {
            return className === 'economy_to_prestige' || className.includes('upgrade') || className.includes('prestige');
        }

        function formatDate(dateStr) {
            const d = new Date(`${dateStr}T00:00:00`);
            const dayName = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
            return {
                shortDate: `${d.getMonth() + 1}/${d.getDate()}`,
                dayName,
                weekend: d.getDay() === 0 || d.getDay() === 6
            };
        }

        function filteredRouteEntries() {
            const routes = allData.routes || {};
            const entries = [];

            Object.entries(routes).forEach(([route, dates]) => {
                const [origin, dest] = route.split('-');
                if (currentDestFilter !== 'all' && dest !== currentDestFilter) return;

                const filteredDates = {};
                Object.entries(dates || {}).forEach(([dateStr, classes]) => {
                    const classList = Array.isArray(classes) ? classes : [];
                    const hasUpgrade = classList.some(isUpgradeClass);
                    if (currentClassFilter === 'all' || hasUpgrade) {
                        filteredDates[dateStr] = classList;
                    }
                });

                if (Object.keys(filteredDates).length > 0) {
                    entries.push({ origin, dest, route, dates: filteredDates });
                }
            });

            entries.sort((a, b) => Object.keys(b.dates).length - Object.keys(a.dates).length || a.dest.localeCompare(b.dest));
            return entries;
        }

        function renderRoutes() {
            const container = document.getElementById('content');
            const emptyState = document.getElementById('empty-state');
            const entries = filteredRouteEntries();

            container.innerHTML = '';
            document.getElementById('stat-routes').textContent = entries.length;
            document.getElementById('stat-dates').textContent = entries.reduce((sum, entry) => sum + Object.keys(entry.dates).length, 0);

            if (entries.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            entries.forEach(entry => container.appendChild(createRouteCard(entry)));
            emptyState.classList.add('hidden');
            container.classList.remove('hidden');
        }

        function createRouteCard({ origin, dest, dates }) {
            const section = document.createElement('section');
            section.className = 'route-card surface rounded-xl p-5 md:p-6';
            const sortedDates = Object.keys(dates).sort();

            section.innerHTML = `
                <div class="flex flex-col gap-3 border-b border-slate-100 pb-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl font-bold text-slate-800">${origin}</span>
                        <span class="text-sky-700">-></span>
                        <div>
                            <span class="block text-2xl font-bold text-sky-800">${dest}</span>
                            <span class="text-xs text-slate-500">${DEST_NAMES[dest] || dest}</span>
                        </div>
                    </div>
                    <span class="w-fit rounded-full bg-sky-50 px-3 py-1.5 text-sm font-semibold text-sky-800">${sortedDates.length}일 가능</span>
                </div>
                <div class="mt-4 grid grid-cols-3 gap-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8">
                    ${sortedDates.map(dateStr => {
                        const { shortDate, dayName, weekend } = formatDate(dateStr);
                        return `
                            <div class="rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-center shadow-sm" title="${dateStr}">
                                <span class="block text-xs font-semibold ${weekend ? 'text-slate-500' : 'text-slate-400'}">${dayName}</span>
                                <span class="mt-1 block text-lg font-bold text-emerald-800">${shortDate}</span>
                                <span class="mt-1 inline-flex rounded-full bg-white px-2 py-0.5 text-[11px] font-bold text-emerald-700">승급</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            return section;
        }

        document.getElementById('dest-filter').addEventListener('change', (e) => {
            currentDestFilter = e.target.value;
            renderRoutes();
        });

        document.querySelectorAll('.filter-pill').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-pill').forEach(node => node.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentClassFilter = e.currentTarget.dataset.class;
                renderRoutes();
            });
        });

        loadData();
    </script>
</body>
</html>
